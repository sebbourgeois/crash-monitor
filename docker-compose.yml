services:
  crash-monitor:
    build: .
    image: stake-crash-monitor:latest
    container_name: stake-crash-monitor
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # One SQLite file per site, both on the same persistent volume.
      DB_PATH: /data/crash_results.db
      SHUFFLE_DB_PATH: /data/shuffle_crash_results.db
      ROOBET_DB_PATH: /data/roobet_crash_results.db
      GOATED_DB_PATH: /data/goated_crash_results.db
      SITES: ${SITES:-all}
      STAKE_ENABLED: ${STAKE_ENABLED:-true}
      SHUFFLE_ENABLED: ${SHUFFLE_ENABLED:-true}
      ROOBET_ENABLED: ${ROOBET_ENABLED:-true}
      GOATED_ENABLED: ${GOATED_ENABLED:-true}
      PORT: 3000
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_SITES: ${TELEGRAM_SITES:-all}
      DESKTOP_NOTIFICATIONS_ENABLED: "false"
    # One headless Chromium per site now shares this container, and Docker's
    # default 64 MB /dev/shm makes Chromium crash tabs under that pressure.
    shm_size: 768m
    volumes:
      - crash_data:/data

volumes:
  crash_data:
